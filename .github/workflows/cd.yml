name: cd

# Runs on every push to main (that is, every merged pull request).
# test -> build-push -> deploy. Each stage needs the one before it, so an image built from
# code whose tests failed is never published.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: cd api && pytest -q --cov=app --cov-fail-under=60
      - run: cd indexer && pytest -q

  build-push:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        image: [api, indexer, ui]
    steps:
      - uses: actions/checkout@v4
      # Indexed documents are baked into the indexer image. In CI only the committed fixture
      # corpus exists (corpus/raw is gitignored): the image for the REAL corpus is built
      # locally with `make images`. See README, "What gets deployed where".
      - name: Stage the fixture corpus into the indexer build context
        if: matrix.image == 'indexer'
        run: cp -r eval/fixtures/. indexer/corpus-stage/
      - uses: docker/setup-buildx-action@v3
      # A Docker Hub ACCESS TOKEN from GitHub Secrets, never the account password.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: true
          # The commit SHA is the version. "What is running?" is one word you can paste
          # into `git show`. There is deliberately no :latest.
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      # The ephemeral cluster needs embeddings to index the fixture corpus: Ollama on the
      # runner, embedding model only. The LLM stays a stub (LLM_PROVIDER=stub below).
      - name: Start Ollama and pull the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_HOST=0.0.0.0 nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:11434/api/version && break; sleep 2; done
          ollama pull nomic-embed-text
      - name: Create an ephemeral kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: rahbar
          config: .github/kind-config.yaml
      - name: Install the ingress controller (pinned)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/kind/deploy.yaml
          kubectl wait -n ingress-nginx --for=condition=ready pod \
            -l app.kubernetes.io/component=controller --timeout=180s
      - name: Install kustomize (pinned)
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/
      # Deploy the exact images that build-push just published, by commit SHA.
      - name: Deploy the SHA-tagged images (prod overlay)
        working-directory: k8s/overlays/prod
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          GATEWAY=$(docker network inspect kind -f '{{(index .IPAM.Config 0).Gateway}}')
          for i in api indexer ui; do
            kustomize edit set image rahbar-$i=$DH_USER/rahbar-$i:${{ github.sha }}
          done
          kustomize edit add patch --kind ConfigMap --name rahbar-config --patch \
            "[{\"op\":\"replace\",\"path\":\"/data/OLLAMA_URL\",\"value\":\"http://${GATEWAY}:11434\"},{\"op\":\"replace\",\"path\":\"/data/LLM_PROVIDER\",\"value\":\"stub\"}]"
          cat kustomization.yaml
          kubectl apply -k .
      - name: Wait for the rollout
        run: |
          kubectl rollout status statefulset/chroma -n rahbar --timeout=180s
          kubectl rollout status deployment/redis -n rahbar --timeout=120s
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=600s \
            || { kubectl describe job/indexer -n rahbar; kubectl logs -n rahbar job/indexer --tail=60; exit 1; }
          kubectl rollout status deployment/api -n rahbar --timeout=240s
          kubectl rollout status deployment/ui -n rahbar --timeout=120s
      - name: Smoke test through the Ingress
        run: |
          curl -fsS -H "Host: rahbar.local" http://localhost/ | grep -qi "<html"
          curl -fsS -H "Host: rahbar.local" http://localhost/api/ask \
            -H 'Content-Type: application/json' \
            -d '{"question":"What is the minimum attendance requirement?"}' > /tmp/answer.json
          python -m json.tool /tmp/answer.json
          python -c "import json; r=json.load(open('/tmp/answer.json')); assert r['retrieved'] and r['citations'], 'no grounded answer'"
      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -n rahbar -o wide || true
          kubectl describe pods -n rahbar | tail -80 || true
          kubectl logs -n rahbar deployment/api --tail=60 || true
          tail -30 /tmp/ollama.log || true
