name: cd

# Runs on every push to main (that is, every merged pull request).
# test -> build-push -> deploy. Each stage needs the one before it, so an image built from
# code whose tests failed is never published.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: cd api && pytest -q --cov=app --cov-fail-under=60
      - run: cd indexer && pytest -q

  build-push:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        image: [api, indexer, ui]
    steps:
      - uses: actions/checkout@v4
      # Indexed documents are baked into the indexer image. In CI only the committed fixture
      # corpus exists (corpus/raw is gitignored): the image for the REAL corpus is built
      # locally with `make images`. See README, "What gets deployed where".
      - name: Stage the fixture corpus into the indexer build context
        if: matrix.image == 'indexer'
        run: cp -r eval/fixtures/. indexer/corpus-stage/
      - uses: docker/setup-buildx-action@v3
      # A Docker Hub ACCESS TOKEN from GitHub Secrets, never the account password.
      - name: Login to Docker Hub
        run: |
          printf '%s' "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: true
          # The commit SHA is the version. "What is running?" is one word you can paste
          # into `git show`. There is deliberately no :latest.
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create an ephemeral kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: rahbar
          config: .github/kind-config.yaml
      - name: Install the ingress controller (pinned)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/kind/deploy.yaml
          kubectl wait -n ingress-nginx --for=condition=ready pod \
            -l app.kubernetes.io/component=controller --timeout=180s
      - name: Install kustomize (pinned)
        run: |
          if command -v kustomize >/dev/null 2>&1; then
            kustomize version   # preinstalled on the runner: no download needed
          else
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
            sudo mv kustomize /usr/local/bin/
          fi
      # The ephemeral cluster has no model server, so it runs the same stub/dummy
      # configuration as the CI e2e job (k8s/overlays/ci): it proves that the images that
      # build-push just published, pinned by commit SHA, start, become ready and answer
      # through the Ingress. The real pipeline with real embeddings runs on the local cluster.
      - name: Deploy the SHA-tagged images
        working-directory: k8s/overlays/ci
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for i in api indexer ui; do
            kustomize edit set image rahbar-$i=$DH_USER/rahbar-$i:${{ github.sha }}
          done
          cat kustomization.yaml
          kubectl apply -k .
      - name: Wait for the rollout
        run: |
          kubectl rollout status statefulset/chroma -n rahbar --timeout=180s
          kubectl rollout status deployment/redis -n rahbar --timeout=120s
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=300s \
            || { kubectl describe job/indexer -n rahbar; kubectl logs -n rahbar -l app=indexer --all-containers --tail=80; exit 1; }
          kubectl rollout status deployment/api -n rahbar --timeout=240s
          kubectl rollout status deployment/ui -n rahbar --timeout=120s
      - name: Smoke test through the Ingress
        run: |
          for n in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: rahbar.local' \
              -H 'Content-Type: application/json' \
              -d '{"question":"warm up request"}' http://localhost/api/ask)
            echo "attempt $n: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 3
          done
          curl -fsS -H "Host: rahbar.local" http://localhost/ | grep -qi "<html"
          curl -fsS -H "Host: rahbar.local" http://localhost/api/ask \
            -H 'Content-Type: application/json' \
            -d '{"question":"What is the minimum attendance requirement?"}' > /tmp/answer.json
          python3 -m json.tool /tmp/answer.json
          python3 -c "import json; r=json.load(open('/tmp/answer.json')); assert 'answer' in r and r.get('request_id'), 'bad response'"
      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -n rahbar -o wide || true
          kubectl describe pods -n rahbar | tail -100 || true
          kubectl logs -n rahbar -l app=indexer --all-containers --tail=80 || true
          kubectl logs -n rahbar deployment/api --tail=60 || true
