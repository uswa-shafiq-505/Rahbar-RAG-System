name: ci

# Runs on every pull request to main and on every push to dev. Nothing here publishes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: ruff check api indexer eval corpus
      - run: cd api && mypy app
      - run: cd indexer && mypy pipeline

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      # Stub provider, fake Chroma and fake Redis: no network, no model.
      - run: cd api && pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60
      - run: cd indexer && pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kubectl kustomize is the same engine as `kustomize build`.
      # Run kubeconform through Docker to avoid release binary download issues.
      - name: Validate every overlay
        run: |
          for overlay in dev prod ci; do
            echo "== $overlay"
            kubectl kustomize k8s/overlays/$overlay | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary
          done
  
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:     
      matrix:
        image: [api, indexer, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Stage the CI fixture corpus into the indexer build context
        if: matrix.image == 'indexer'
        run: cp -r eval/fixtures/. indexer/corpus-stage/
      - uses: docker/setup-buildx-action@v3
      # push: false. A pull request must never publish an image.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: false
          tags: rahbar-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  scan:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        image: [api, indexer, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Stage the CI fixture corpus into the indexer build context
        if: matrix.image == 'indexer'
        run: cp -r eval/fixtures/. indexer/corpus-stage/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          load: true
          push: false
          tags: rahbar-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
      # Fail on HIGH or CRITICAL findings that have a fix available.
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: rahbar-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  e2e-eval:
    runs-on: ubuntu-latest
    needs: [manifests, build]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install pyyaml httpx

      # Real embeddings on the runner (the pinned nomic-embed-text); the LLM stays a stub.
      - name: Start Ollama and pull the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_HOST=0.0.0.0 nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:11434/api/version && break; sleep 2; done
          ollama pull nomic-embed-text

      - name: Create a kind cluster with an Ingress port mapping
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: rahbar
          config: .github/kind-config.yaml
      - name: Install the ingress controller (pinned)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/kind/deploy.yaml
          kubectl wait -n ingress-nginx --for=condition=ready pod \
            -l app.kubernetes.io/component=controller --timeout=180s

      - name: Build images (fixture corpus baked into the indexer) and load them into kind
        run: |
          cp -r eval/fixtures/. indexer/corpus-stage/
          for i in api indexer ui; do
            docker build -t rahbar-$i:ci $i
            kind load docker-image rahbar-$i:ci --name rahbar
          done

      - name: Install kustomize (pinned)
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Apply the manifests
        run: |
          # Embeddings come from Ollama on the runner: reach it through the docker gateway.
          GATEWAY=$(docker network inspect kind -f '{{(index .IPAM.Config 0).Gateway}}')
          cd k8s/overlays/ci
          kustomize edit add patch --kind ConfigMap --name rahbar-config \
            --patch "[{\"op\":\"replace\",\"path\":\"/data/OLLAMA_URL\",\"value\":\"http://${GATEWAY}:11434\"}]"
          kubectl apply -k .

      - name: Wait for storage, the indexer Job and the rollout
        run: |
          kubectl rollout status statefulset/chroma -n rahbar --timeout=180s
          kubectl rollout status deployment/redis -n rahbar --timeout=120s
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=600s \
            || { kubectl describe job/indexer -n rahbar; kubectl logs -n rahbar job/indexer --tail=80; exit 1; }
          kubectl rollout status deployment/api -n rahbar --timeout=240s
          kubectl rollout status deployment/ui -n rahbar --timeout=120s

      - name: Run the eval gate against the live stack, through the Ingress
        run: |
          python eval/run_eval.py --api http://localhost --host rahbar.local \
            --golden eval/fixtures/golden.fixture.yaml \
            --baseline eval/fixtures/baseline.fixture.json \
            --out eval/results.fixture.json

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -n rahbar -o wide || true
          kubectl describe pods -n rahbar | tail -80 || true
          kubectl logs -n rahbar deployment/api --tail=80 || true
          tail -30 /tmp/ollama.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results.fixture.json
          if-no-files-found: ignore
