name: ci

# Runs on every pull request to main and on every push to dev. Nothing here publishes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: ruff check api indexer eval corpus
      - run: cd api && mypy app
      - run: cd indexer && mypy pipeline

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      # Stub provider, fake Chroma and fake Redis: no network, no model.
      - run: cd api && pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60
      - run: cd indexer && pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kubectl kustomize is the same engine as `kustomize build`.
      # Run kubeconform through Docker to avoid release binary download issues.
      - name: Validate every overlay
        run: |
          for overlay in dev prod ci; do
            echo "== $overlay"
            kubectl kustomize k8s/overlays/$overlay | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary
          done
  
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:     
      matrix:
        image: [api, indexer, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Stage the CI fixture corpus into the indexer build context
        if: matrix.image == 'indexer'
        run: cp -r eval/fixtures/. indexer/corpus-stage/
      - uses: docker/setup-buildx-action@v3
      # push: false. A pull request must never publish an image.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: false
          tags: rahbar-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  scan:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        image: [api, indexer, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Stage the CI fixture corpus into the indexer build context
        if: matrix.image == 'indexer'
        run: cp -r eval/fixtures/. indexer/corpus-stage/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          load: true
          push: false
          tags: rahbar-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
      # Fail on HIGH or CRITICAL findings that have a fix available.
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: rahbar-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  e2e-eval:
    runs-on: ubuntu-latest
    needs: [manifests, build]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install pyyaml httpx

      - name: Create a kind cluster with an Ingress port mapping
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: rahbar
          config: .github/kind-config.yaml

      - name: Install the ingress controller (pinned)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/kind/deploy.yaml
          kubectl wait -n ingress-nginx --for=condition=ready pod \
            -l app.kubernetes.io/component=controller --timeout=180s

      - name: Build images (fixture corpus baked into the indexer) and load them into kind
        run: |
          cp -r eval/fixtures/. indexer/corpus-stage/
          for i in api indexer ui; do
            docker build -t rahbar-$i:ci $i
            kind load docker-image rahbar-$i:ci --name rahbar
          done

      - name: Install kustomize (pinned)
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Apply the manifests
        run: |
          kubectl kustomize k8s/overlays/ci > /tmp/ci.yaml
          echo "=== Rendered ConfigMap ==="
          sed -n '/kind: ConfigMap/,/---/p' /tmp/ci.yaml
          echo "=== Rendered indexer Job ==="
          sed -n '/kind: Job/,/---/p' /tmp/ci.yaml
          if ! grep -q -- '--dummy' /tmp/ci.yaml || ! grep -q 'LLM_PROVIDER: stub' /tmp/ci.yaml; then
            echo "Manifest verification failed: missing --dummy or LLM_PROVIDER: stub"
            cat /tmp/ci.yaml
            exit 1
          fi
          kubectl apply -f /tmp/ci.yaml
          kubectl get cm rahbar-config -n rahbar -o yaml
          kubectl get job indexer -n rahbar -o jsonpath='{.spec.template.spec.containers[0].args}{"\n"}{.spec.template.spec.containers[0].env}'
          echo ""
          kubectl delete networkpolicy --all -n rahbar || true
          nohup bash -c 'for i in $(seq 1 150); do kubectl logs -n rahbar -l job-name=indexer --all-containers --tail=-1 -f --prefix >> /tmp/indexer-stream.log 2>&1; sleep 3; done' >/dev/null 2>&1 &

      - name: Wait for storage, the indexer Job and the rollout
        run: |
          kubectl rollout status statefulset/chroma -n rahbar --timeout=180s
          kubectl rollout status deployment/redis -n rahbar --timeout=120s
          RESULT=timeout
          for i in $(seq 1 30); do
            S=$(kubectl get job/indexer -n rahbar -o jsonpath='{.status.succeeded}' 2>/dev/null)
            F=$(kubectl get job/indexer -n rahbar -o jsonpath='{.status.failed}' 2>/dev/null)
            echo "t=$((i*5))s succeeded=${S:-0} failed=${F:-0}"
            if [ "${S:-0}" = "1" ]; then RESULT=ok; break; fi
            if [ "${F:-0}" -ge 1 ]; then RESULT=failed; break; fi
            sleep 5
          done
          echo "Indexer result: $RESULT"
          if [ "$RESULT" != "ok" ]; then
            echo "=== STREAMED INDEXER LOGS ==="; cat /tmp/indexer-stream.log || true
            exit 1
          fi
          kubectl rollout status deployment/api -n rahbar --timeout=240s
          kubectl rollout status deployment/ui -n rahbar --timeout=120s

      - name: Wait until the Ingress routes to a ready api
        run: |
          for n in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: rahbar.local' \
              -H 'Content-Type: application/json' \
              -d '{"question":"warm up request"}' http://localhost/api/ask)
            echo "attempt $n: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          kubectl get pods,endpoints,ingress -n rahbar -o wide
          exit 1

      - name: Run the eval gate against the live stack, through the Ingress
        run: |
          python eval/run_eval.py --api http://localhost --host rahbar.local \
            --golden eval/fixtures/golden.fixture.yaml \
            --baseline eval/fixtures/baseline.fixture.json \
            --out eval/results.fixture.json

      - name: Indexer debug (always runs)
        if: always()
        run: |
          echo "=== STREAMED INDEXER LOGS ==="; cat /tmp/indexer-stream.log || true
          echo "=== POD EXIT REASONS ==="
          kubectl get pods -n rahbar -l job-name=indexer -o jsonpath='{range .items[*]}{.metadata.name}{" reason="}{.status.containerStatuses[0].state.terminated.reason}{" exit="}{.status.containerStatuses[0].state.terminated.exitCode}{"\n"}{end}' || true
          echo "=== PODS ==="; kubectl get pods -n rahbar -o wide || true
          echo "=== POD DESCRIBE ==="; kubectl describe pod -n rahbar -l job-name=indexer || true
          echo "=== LOGS PER POD ==="
          for p in $(kubectl get pods -n rahbar -l job-name=indexer -o name); do echo "--- $p"; kubectl logs -n rahbar $p --all-containers || true; done
          echo "=== EVENTS ==="; kubectl get events -n rahbar --sort-by=.lastTimestamp || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results.fixture.json
          if-no-files-found: ignore