  - id: q05
    type: ordinary
    question: How is SGPA calculated at FAST-NUCES?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: "2.4  SGPA is calculated as follows:"}
    expect: "GPA"
    must_abstain: false
    expected_source: academic-rules-handbook-jun-2026.pdf
    expected_section: "2.4  SGPA is calculated as follows:"
    expected_page: 11
    notes: Tests retrieval of the SGPA calculation formula from the 2026 handbook.

  - id: q06
    type: ordinary
    question: What letter grade corresponds to a grade point of 4.00 at FAST-NUCES?
    relevant:
      - {source: grading-page.html, section: "Preamble"}
    expect: "A"
    must_abstain: false
    expected_source: grading-page.html
    expected_section: "Preamble"
    expected_page: 1
    notes: Tests the grading page HTML corpus; grade A = 4.00.

  - id: q07
    type: ordinary
    question: What conduct rules apply to student social media use at FAST-NUCES?
    relevant:
      - {source: student-handbook-jun-2026.pdf, section: "22. Social Media Etiquettes"}
    expect: "social media"
    must_abstain: false
    expected_source: student-handbook-jun-2026.pdf
    expected_section: "22. Social Media Etiquettes"
    expected_page: 14
    notes: Tests retrieval of social-media etiquette rules from the student handbook.

  - id: q08
    type: ordinary
    question: What is the procedure for withdrawing from a course at FAST-NUCES?
    relevant:
      - {source: prospectus-2026-academic-rules-and-regulations.pdf, section: "16. Withdrawal from a Course"}
    expect: "withdraw"
    must_abstain: false
    expected_source: prospectus-2026-academic-rules-and-regulations.pdf
    expected_section: "16. Withdrawal from a Course"
    expected_page: 2
    notes: Tests retrieval of the course-withdrawal procedure from the 2026 prospectus.

  # ── VERSION-SENSITIVE ────────────────────────────────────────────────────────

  - id: q09
    type: version_sensitive
    question: If I fail a course and repeat it, is my new grade capped at any maximum?
    relevant:
      - {source: prospectus-2026-academic-rules-and-regulations.pdf, section: "17. Repeating a Course"}
      - {source: undergraduate-academic-rules-aug-2023.pdf, section: "3.3. New admissions in undergraduate programs are normally"}
    expect: "most recent"
    must_abstain: false
    expected_source: prospectus-2026-academic-rules-and-regulations.pdf
    expected_section: "17. Repeating a Course"
    expected_page: 3
    notes: Answer differs between 2023 (grade capped at B) and 2026 (most recent grade counts); tests version awareness.

  - id: q10
    type: version_sensitive
    question: What was the minimum attendance requirement under the August 2023 undergraduate academic rules?
    relevant:
      - {source: undergraduate-academic-rules-aug-2023.pdf, section: "2 FAST-NUCES"}
    expect: "100"
    must_abstain: false
    expected_source: undergraduate-academic-rules-aug-2023.pdf
    expected_section: "2 FAST-NUCES"
    expected_page: 7
    notes: Clause 1.21 in the superseded 2023 rules requires 100% attendance; tests version-sensitive retrieval.

  # ── EXACT TERM ───────────────────────────────────────────────────────────────

  - id: q11
    type: exact_term
    question: What does clause 1.21 of the FAST-NUCES academic rules require?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: "1. Introduction"}
    expect: "100%"
    must_abstain: false
    expected_source: academic-rules-handbook-jun-2026.pdf
    expected_section: "1. Introduction"
    expected_page: 9
    notes: Tests exact clause retrieval — clause 1.21 in the 2026 handbook mandates 100% attendance.

  - id: q12
    type: exact_term
    question: What CGPA threshold triggers academic warning under clause 5.4 of the academic rules handbook?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: "5. Academic Assessment"}
    expect: "2.00"
    must_abstain: false
    expected_source: academic-rules-handbook-jun-2026.pdf
    expected_section: "5. Academic Assessment"
    expected_page: 23
    notes: Tests exact clause number retrieval — 5.4 specifies the CGPA 2.00 warning threshold.

