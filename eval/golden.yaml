questions:

  # ── ORDINARY ────────────────────────────────────────────────────────────────

  - id: q01
    type: ordinary
    question: What CGPA does an undergraduate need to avoid academic warning?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: "5. Academic Assessment"}
    expect: "2.00"
    must_abstain: false
    expected_source: academic-rules-handbook-jun-2026.pdf
    expected_section: "5. Academic Assessment"
    expected_page: 23
    notes: Tests core academic-warning threshold (CGPA 2.00); answer is in §5 of 2026 handbook.

  - id: q02
    type: ordinary
    question: What is the minimum attendance percentage required to sit the final exam?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: "1. Introduction"}
    expect: "80"
    must_abstain: false
    expected_source: academic-rules-handbook-jun-2026.pdf
    expected_section: "1. Introduction"
    expected_page: 5
    notes: Tests retrieval of the 80% attendance rule from the 2026 handbook.

  - id: q03
    type: ordinary
    question: What generative AI tools are acceptable for use in coursework at FAST-NUCES?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: "4. Acceptable Uses of Generative AI Tools"}
    expect: "acceptable"
    must_abstain: false
    expected_source: academic-rules-handbook-jun-2026.pdf
    expected_section: "4. Acceptable Uses of Generative AI Tools"
    expected_page: 43
    notes: Tests the generative-AI acceptable-use policy from the 2026 handbook.

  - id: q04
    type: ordinary
    question: What actions are prohibited in the examination hall at FAST-NUCES?
    relevant:
      - {source: student-handbook-jun-2026.pdf, section: "V - EXAMINATION RULES"}
    expect: "prohibited"
    must_abstain: false
    expected_source: student-handbook-jun-2026.pdf
    expected_section: "V - EXAMINATION RULES"
    expected_page: 25
