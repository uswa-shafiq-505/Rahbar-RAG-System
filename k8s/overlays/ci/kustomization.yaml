# Used only by the GitHub Actions e2e job (kind cluster). Indexer runs --dummy (no Ollama,
# no corpus), stub retriever and stub LLM provider. No external model is required; the job
# validates the Kubernetes Job, StatefulSet, PVC, probes, and Ingress only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - {name: rahbar-api, newName: rahbar-api, newTag: ci}
  - {name: rahbar-indexer, newName: rahbar-indexer, newTag: ci}
  - {name: rahbar-ui, newName: rahbar-ui, newTag: ci}
patches:
  # Dummy mode: stub retriever + stub LLM + dummy-768 embeddings. Valid placeholder for OLLAMA_URL.
  - target: {kind: ConfigMap, name: rahbar-config}
    patch: |-
      - {op: add, path: /data/LLM_PROVIDER, value: stub}
      - {op: add, path: /data/RETRIEVER, value: stub}
      - {op: add, path: /data/EMBED_MODEL, value: dummy-768}
      - {op: add, path: /data/OLLAMA_URL, value: "http://127.0.0.1:11434"}
      - {op: add, path: /data/RELEVANCE_FLOOR, value: "1.1"}
      - {op: add, path: /data/REDIS_HOST, value: ""}

  # Indexer Job patch: dummy mode, backoffLimit 0, restartPolicy Never, requests/limits unchanged from base
  - path: job-indexer.yaml

  # Remove ALL NetworkPolicies in CI — kindnet's ipBlock+except handling
  # is unreliable and unnecessary for CI.
  - target:
      kind: NetworkPolicy
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: ignored
