# Used only by the GitHub Actions e2e job (kind cluster). Real indexer and real embeddings
# (Ollama on the runner), stub LLM so no generation model is needed. The workflow adds one
# more patch at run time: OLLAMA_URL, the docker gateway address of the runner.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - {name: rahbar-api, newName: rahbar-api, newTag: ci}
  - {name: rahbar-indexer, newName: rahbar-indexer, newTag: ci}
  - {name: rahbar-ui, newName: rahbar-ui, newTag: ci}
patches:
  - target: {kind: ConfigMap, name: rahbar-config}
    patch: |-
      - {op: replace, path: /data/LLM_PROVIDER, value: stub}

  # Remove ALL NetworkPolicies in CI — kindnet's ipBlock+except handling
  # is unreliable and this is the most likely cause of indexer failing
  # to reach the host gateway on :11434.
  - target:
      kind: NetworkPolicy
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: ignored

  # Raise indexer memory to 3Gi (OCR + embeddings on CPU can OOM at 1536Mi)
  - target:
      kind: Job
      name: indexer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 3Gi

  # Make the failed pod survive so we can read logs
  - target:
      kind: Job
      name: indexer
    patch: |-
      - op: replace
        path: /spec/backoffLimit
        value: 0
      - op: replace
        path: /spec/template/spec/restartPolicy
        value: Never
