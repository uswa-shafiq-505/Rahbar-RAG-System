# What the cd.yml workflow deploys. Images come from Docker Hub and are pinned by commit SHA:
# cd.yml runs `kustomize edit set image rahbar-api=<user>/rahbar-api:<sha>` (never :latest).
# The placeholders below only have to be valid for `kustomize build | kubeconform`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

images:
  - {name: rahbar-api, newName: uswashafiq505/rahbar-api, newTag: PLACEHOLDER_SHA}
  - {name: rahbar-indexer, newName: uswashafiq505/rahbar-indexer, newTag: PLACEHOLDER_SHA}
  - {name: rahbar-ui, newName: uswashafiq505/rahbar-ui, newTag: PLACEHOLDER_SHA}
