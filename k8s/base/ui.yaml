apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: rahbar
  labels: {app: ui, app.kubernetes.io/part-of: rahbar}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: ui}
  template:
    metadata:
      labels: {app: ui, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: ui-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ui
          image: rahbar-ui
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: tmp, mountPath: /tmp}     # nginx pid and temp files (see ui/nginx.conf)
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
