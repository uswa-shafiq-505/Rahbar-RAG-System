# One host. /api goes to the api Service UNCHANGED (the app serves /api/ask itself), / goes to
# the ui. Needs: minikube addons enable ingress, and "<minikube ip>  rahbar.local" in /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahbar
  namespace: rahbar
  labels: {app.kubernetes.io/part-of: rahbar}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"   # generation can take a while
spec:
  ingressClassName: nginx
  rules:
    - host: rahbar.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: api, port: {number: 8000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: ui, port: {number: 80}}
