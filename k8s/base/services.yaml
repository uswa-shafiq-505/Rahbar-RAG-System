# Four Services, all ClusterIP. Chroma and Redis are never NodePort or LoadBalancer.
apiVersion: v1
kind: Service
metadata: {name: api, namespace: rahbar, labels: {app: api}}
spec:
  type: ClusterIP
  selector: {app: api}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata: {name: ui, namespace: rahbar, labels: {app: ui}}
spec:
  type: ClusterIP
  selector: {app: ui}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: Service
metadata: {name: chroma, namespace: rahbar, labels: {app: chroma}}
spec:
  type: ClusterIP
  selector: {app: chroma}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: rahbar, labels: {app: redis}}
spec:
  type: ClusterIP
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
