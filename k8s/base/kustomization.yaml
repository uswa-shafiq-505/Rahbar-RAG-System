apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - chroma-statefulset.yaml
  - redis.yaml
  - api.yaml
  - ui.yaml
  - services.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - indexer-job.yaml
  - reindex-cronjob.yaml
# secret.placeholder.yaml is intentionally NOT listed: applying it would overwrite the real
# Secret. Create the real one with `make secret`.
