# One ServiceAccount per workload (section 4.7: "everything is admin"). None of them calls
# the Kubernetes API, so none of them gets a token mounted and none gets any RBAC.
apiVersion: v1
kind: ServiceAccount
metadata: {name: api-sa, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ui-sa, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: chroma-sa, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: redis-sa, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: indexer-sa, namespace: rahbar}
automountServiceAccountToken: false
