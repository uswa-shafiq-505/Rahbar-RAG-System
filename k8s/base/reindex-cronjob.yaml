# Weekly re-index: same image and arguments as the Job. Manual re-index, no redeploy:
#   kubectl create job --from=cronjob/reindex manual-reindex-1 -n rahbar
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels: {app: indexer, app.kubernetes.io/part-of: rahbar}
spec:
  schedule: "0 3 * * 0"          # Sundays 03:00
  concurrencyPolicy: Forbid       # never two writers on one collection
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 4
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: {app: indexer, app.kubernetes.io/part-of: rahbar}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: indexer-sa
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: wait-for-chroma
              image: rahbar-indexer
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -c
                - |
                  import time, urllib.request
                  for _ in range(90):
                      try:
                          urllib.request.urlopen("http://chroma:8000/api/v2/heartbeat", timeout=2)
                          print("chroma is up")
                          break
                      except Exception as exc:
                          print("waiting for chroma:", exc)
                          time.sleep(2)
                  else:
                      raise SystemExit("chroma never became reachable")
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: indexer
              image: rahbar-indexer
              imagePullPolicy: IfNotPresent
              args: ["python", "-m", "pipeline.run"]
              envFrom:
                - configMapRef: {name: rahbar-config}
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1536Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 1Gi}
