# Chroma is a StatefulSet, not a Deployment (ADR 0001 / ARCHITECTURE): it owns a stable
# identity (chroma-0) and its own PVC through volumeClaimTemplates, so deleting the pod
# re-attaches the SAME volume. A Deployment's replicas would share or fight over one claim.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
  labels: {app: chroma, app.kubernetes.io/part-of: rahbar}
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels: {app: chroma}
  template:
    metadata:
      labels: {app: chroma, app.kubernetes.io/part-of: rahbar}
    spec:
      enableServiceLinks: false
      serviceAccountName: chroma-sa
      automountServiceAccountToken: false
      securityContext:
#       runAsNonRoot: true
#       runAsUser: 1000
#       runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12     # same version as chromadb-client in requirements.txt
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: IS_PERSISTENT, value: "TRUE"}
            - {name: PERSIST_DIRECTORY, value: /data}
            - {name: ANONYMIZED_TELEMETRY, value: "FALSE"}
            - {name: CHROMA_PORT, value: "8000"}
          startupProbe:
            httpGet: {path: /api/v2/heartbeat, port: http}
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /api/v2/heartbeat, port: http}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /api/v2/heartbeat, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: chroma-data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
