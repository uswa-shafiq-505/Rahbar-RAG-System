# DOCUMENTS THE SHAPE of the Secret. It holds no real value and is deliberately NOT listed in
# kustomization.yaml (applying it would overwrite the real Secret with REPLACE_ME).
# Create the real one from the command line, never from a file:
#   export LLM_API_KEY=...        # only needed for LLM_PROVIDER=hosted
#   make secret
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
