# Deny by default, then allow only the paths the architecture needs (section 4.7).
# Requires a CNI that enforces policy: minikube start --cni=calico.
#
#   Ingress controller -> ui, api        ui -> api
#   api -> chroma, redis, LLM            indexer -> chroma, embedding host
#   (nothing else: the ui pod cannot reach chroma, and nothing reaches redis but the api)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-all, namespace: rahbar}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Without this, default-deny egress also blocks DNS and every Service name stops resolving.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns-egress, namespace: rahbar}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ui-from-ingress, namespace: rahbar}
spec:
  podSelector: {matchLabels: {app: ui}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {protocol: TCP, port: 8080}
---
# We must explicitly allow the UI to send traffic to the API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ui-egress, namespace: rahbar}
spec:
  podSelector: {matchLabels: {app: ui}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: api}}
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-from-ingress-and-ui, namespace: rahbar}
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
        - podSelector:
            matchLabels: {app: ui}
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: chroma-from-api-and-indexer, namespace: rahbar}
spec:
  podSelector: {matchLabels: {app: chroma}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
        - podSelector: {matchLabels: {app: indexer}}
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: redis-from-api, namespace: rahbar}
spec:
  podSelector: {matchLabels: {app: redis}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
      ports:
        - {protocol: TCP, port: 6379}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-egress, namespace: rahbar}
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: chroma}}
      ports:
        - {protocol: TCP, port: 8000}
    - to:
        - podSelector: {matchLabels: {app: redis}}
      ports:
        - {protocol: TCP, port: 6379}
    # The LLM / embedding host: Ollama on your laptop (11434) or a hosted API (443). The
    # exception keeps this rule from opening the pod and service networks. TIGHTEN to the
    # single host IP: minikube ssh "grep host.minikube.internal /etc/hosts"
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.0.0.0/8]
      ports:
        - {protocol: TCP, port: 11434}
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: indexer-egress, namespace: rahbar}
spec:
  podSelector: {matchLabels: {app: indexer}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: chroma}}
      ports:
        - {protocol: TCP, port: 8000}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.0.0.0/8]
      ports:
        - {protocol: TCP, port: 11434}
        - {protocol: TCP, port: 443}
