# The semantic cache. A Deployment with a PVC (cache-data) so cached answers survive a pod
# restart. strategy Recreate: a ReadWriteOnce volume cannot be mounted by two pods at once.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache-data
  namespace: rahbar
  labels: {app: redis, app.kubernetes.io/part-of: rahbar}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rahbar
  labels: {app: redis, app.kubernetes.io/part-of: rahbar}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: redis-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data", "--save", "60", "1"]
          ports:
            - {name: redis, containerPort: 6379}
          startupProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: cache-data}
