# Release-gate thresholds as a ConfigMap (Assignment 03, F2). The eval and gate Jobs mount it
# at /config/gate.yaml. Change a value and run the gate Job again: the outcome changes without
# rebuilding any image. Keep it identical to config/gate.yaml (a test checks that).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gate-thresholds
  namespace: rahbar
  labels: {app.kubernetes.io/part-of: rahbar}
data:
  gate.yaml: |
    # Release gate thresholds (Assignment 03, part C2).
    # This file is the source of truth; k8s/base/gate-thresholds.yaml carries the same values as
    # a ConfigMap, and a test keeps the two in sync. Metrics are fractions between 0 and 1.
    # Delete a key to switch that rule off.
    thresholds:
      # recall@5 may not drop by more than 2 points against the baseline run
      max_recall_at_5_drop: 0.02
      # Answers must be supported by the retrieved context. 0.80 is the floor we accept for a
      # 3B local model judged on the golden set; justify your own number with your results.
      min_faithfulness: 0.80
      # Citations must match retrieved chunks (the same bar as the RAHBAR gate: 95 percent).
      min_citation_validity: 0.95
      # p95 end-to-end latency in seconds. Measured on the laptop with a 3B model; justify yours.
      max_latency_p95_seconds: 60.0
      # "baseline" = not lower than the baseline run. A number (for example 1.0) also works.
      min_abstention_correctness: baseline
