# The candidate api (Assignment 03, F3): a second Deployment with its own Service, reading its
# own collection, with the cache switched off so cached answers cannot distort the evaluation.
#   make candidate-up COLLECTION=rahbar_candidate EMBED_MODEL=nomic-embed-text
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
  namespace: rahbar
  labels: {app: api-candidate, app.kubernetes.io/part-of: rahbar}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: api-candidate}
  template:
    metadata:
      labels: {app: api-candidate, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: rahbar-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: rahbar-config}
          env:                      # explicit env wins over the ConfigMap
            - {name: CHROMA_COLLECTION, value: "${COLLECTION}"}
            - {name: EMBED_MODEL, value: "${EMBED_MODEL}"}
            - {name: REDIS_HOST, value: ""}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec: {command: ["sleep", "10"]}
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: data, mountPath: /data}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: data
          persistentVolumeClaim: {claimName: ragops-data}
---
apiVersion: v1
kind: Service
metadata: {name: api-candidate, namespace: rahbar, labels: {app: api-candidate}}
spec:
  type: ClusterIP
  selector: {app: api-candidate}
  ports:
    - {name: http, port: 8000, targetPort: http}
